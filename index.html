<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fline AI</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#151516">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Plus+Jakarta+Sans:wght@300;400;500&family=Outfit:wght@300;400;500&family=Source+Sans+3:wght@300;400;500&family=Barlow+Semi+Condensed:wght@300;400;500&family=Raleway:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--font:'Inter',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
:root,:root[data-theme="dark"]{--bg:#151516;--bg2:#1a1a1c;--text:#e4e3df;--muted:#8a8985;--line:rgba(255,255,255,.08);--glass:rgba(46,46,50,.5);--glow:rgba(255,255,255,.075);--hover:rgba(255,255,255,.05);--user:rgba(255,255,255,.055);--shadow:0 10px 30px rgba(0,0,0,.35)}
:root[data-theme="light"]{--bg:#f2f2f0;--bg2:#eaeae7;--text:#29292b;--muted:#77777a;--line:rgba(0,0,0,.09);--glass:rgba(255,255,255,.55);--glow:rgba(0,0,0,.035);--hover:rgba(0,0,0,.04);--user:rgba(0,0,0,.05);--shadow:0 10px 30px rgba(40,40,40,.08)}
:root[data-theme="cream"]{--bg:#f4efe6;--bg2:#ece6da;--text:#3a362f;--muted:#898277;--line:rgba(70,55,30,.12);--glass:rgba(250,246,238,.6);--glow:rgba(120,95,50,.06);--hover:rgba(80,65,40,.06);--user:rgba(80,65,40,.07);--shadow:0 10px 30px rgba(90,70,40,.1)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-weight:400;font-size:calc(17px*var(--fs,1));line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden;transition:background .3s,color .3s}
button,input,textarea{font:inherit;color:inherit;background:none;border:0;outline:0}
button{cursor:pointer}
:focus-visible{outline:1px solid var(--muted);outline-offset:2px;border-radius:8px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:flex;height:100%}
/* sidebar */
.side{width:290px;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px 14px;flex:none;transition:background .3s,transform .3s}
.brand{display:flex;align-items:center;gap:10px;font-weight:500;letter-spacing:.01em}
.brand svg{width:22px;height:22px}
.side-top{display:flex;align-items:center;justify-content:space-between;padding:0 8px 18px}
.ibtn{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;color:var(--muted);transition:background .2s,color .2s}
.ibtn:hover{background:var(--hover);color:var(--text)}
.search{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--muted);margin-bottom:10px;border:1px solid var(--line)}
.search input{flex:1;min-width:0;font-size:calc(16px*var(--fs,1))}
.search input::placeholder{color:var(--muted)}
.list{flex:1;overflow-y:auto;padding-bottom:12px}
.grp{font-size:calc(14px*var(--fs,1));color:var(--muted);padding:16px 10px 6px}
.item{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px;font-size:calc(16px*var(--fs,1));color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .2s,color .2s}
.item:hover,.item.on{background:var(--hover);color:var(--text)}
.prof{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:10px;color:var(--muted);border-top:1px solid var(--line);border-radius:0;margin-top:4px;padding-top:14px}
.prof:hover{color:var(--text)}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;height:100%}
.main::before{content:"";position:absolute;inset:0 0 auto 0;height:70%;background:radial-gradient(ellipse 50% 60% at 50% 0%,var(--glow),transparent 70%);pointer-events:none;transition:background .3s}
.top{position:relative;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;min-height:60px}
.top .brand{font-size:calc(17px*var(--fs,1))}
.top .menu{display:none}
.chat{position:relative;flex:1;overflow-y:auto;scroll-behavior:smooth}
.col{max-width:720px;margin:0 auto;padding:24px 24px 160px}
.hero{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px 140px;gap:22px}
.hero svg{width:34px;height:34px;opacity:.9}
.hero h1{font-weight:300;font-size:calc(34px*var(--fs,1));letter-spacing:-.015em;line-height:1.25}
.msg{margin:0 0 30px;animation:in .35s ease both}
.msg.u{display:flex;justify-content:flex-end}
.msg.u p{background:var(--user);padding:10px 16px;border-radius:18px 18px 6px 18px;max-width:82%}
.msg.a p,.msg.a li{max-width:62ch;line-height:1.75}
.msg.a p+p{margin-top:12px}
.msg.a ol{padding-left:20px;margin-top:12px;color:var(--text)}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* loading */
.think{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:calc(16px*var(--fs,1));margin-bottom:30px}
.orb{width:8px;height:8px;border-radius:50%;background:var(--text);box-shadow:0 0 14px 3px var(--glow),0 0 4px var(--text);animation:breathe 2.4s ease-in-out infinite}
.think span:last-child{animation:fade 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
@keyframes fade{0%,100%{opacity:.5}50%{opacity:1}}
/* composer */
.dock{position:absolute;left:0;right:0;bottom:0;padding:0 20px calc(18px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 55%);pointer-events:none}
.comp{pointer-events:auto;max-width:720px;margin:0 auto;display:flex;align-items:flex-end;gap:6px;padding:8px 8px 8px 14px;border-radius:32px;min-height:60px;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:var(--shadow);transition:border-color .2s}

.comp textarea{flex:1;resize:none;max-height:140px;padding:10px 6px;line-height:1.5;min-height:44px}
.comp textarea::placeholder{color:var(--muted)}
.send{width:44px;height:44px;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center;opacity:.25;transition:opacity .2s;flex:none}
.send.on{opacity:1}
.comp .ibtn{flex:none;width:44px;height:44px;border-radius:50%;color:var(--text);opacity:.75}.comp .ibtn:hover{opacity:1}.comp svg.i{width:24px;height:24px;stroke-width:1.5}.comp .send svg.i{width:22px;height:22px}.comp textarea:focus-visible,.search input:focus-visible{outline:0}
/* settings */
.set{position:relative;flex:1;overflow-y:auto}
.set .col{padding-bottom:60px}
.back{display:flex;align-items:center;gap:8px;color:var(--muted);padding:6px 0;margin-bottom:28px}
.back:hover{color:var(--text)}
.set h2{font-weight:300;font-size:calc(30px*var(--fs,1));letter-spacing:-.01em;margin-bottom:40px}
.set h3{font-weight:400;font-size:calc(16px*var(--fs,1));color:var(--muted);margin-bottom:14px}
.themes{display:flex;gap:28px;margin-bottom:48px;border-bottom:1px solid var(--line)}
.themes button{padding:0 0 12px;color:var(--muted);border-bottom:1px solid transparent;margin-bottom:-1px;transition:color .2s}
.themes button.on{color:var(--text);border-color:var(--text)}
.fonts button{display:flex;align-items:baseline;justify-content:space-between;gap:16px;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--line);color:var(--muted)}
.fonts button.on{color:var(--text)}
.fonts b{font-weight:400;font-size:calc(22px*var(--fs,1));flex:none}
.fonts small{font-size:calc(15px*var(--fs,1));color:var(--muted);flex:1;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fonts .ck{width:16px;opacity:0}.fonts .on .ck{opacity:1}
.fonts .ck svg{width:16px;height:16px}
.scrim{display:none}
@media(max-width:860px){
 .side{position:fixed;inset:0 auto 0 0;z-index:20;width:min(300px,84%);transform:translateX(-100%);padding-top:calc(20px + env(safe-area-inset-top,0px))}
 .side.open{transform:none}
 .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10}
 .top{padding:10px 14px}.top .menu{display:grid}
 .col{padding:12px 20px 150px}
 .hero h1{font-size:calc(30px*var(--fs,1))}
 .dock{padding:0 12px calc(12px + env(safe-area-inset-bottom,0px))}
 .msg.u p{max-width:90%}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

*{-webkit-tap-highlight-color:transparent}
.comp,.comp *{outline:none!important}
.comp:focus-within{box-shadow:var(--shadow)!important}
.comp textarea{border:0!important;box-shadow:none!important;-webkit-appearance:none;appearance:none;background:transparent!important;border-radius:0!important}
.comp textarea:focus,.comp textarea:focus-visible,.comp button:focus,.comp button:focus-visible{outline:none!important;box-shadow:none!important}
.comp{min-height:64px!important}
.comp .ibtn,.comp .send{width:48px!important;height:48px!important}
.comp .ibtn{opacity:.9!important}
.comp svg.i{width:28px!important;height:28px!important;stroke-width:1.5!important}
.comp .send svg.i{width:24px!important;height:24px!important}
.comp textarea{min-height:48px!important}

.set h3.row{display:flex;justify-content:space-between}
.size{display:flex;align-items:center;gap:18px;margin-bottom:48px}
.size .s1{font-size:14px;color:var(--muted)}.size .s2{font-size:26px;color:var(--muted)}
#sz{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:32px;background:transparent;cursor:pointer;outline:none}
#sz::-webkit-slider-runnable-track{height:1px;background:var(--muted)}
#sz::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--text);margin-top:-10px;box-shadow:0 0 0 6px var(--hover),0 0 14px var(--glow)}
#sz::-moz-range-track{height:1px;background:var(--muted)}
#sz::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:var(--text);box-shadow:0 0 0 6px var(--hover),0 0 14px var(--glow)}
.msg.a p{white-space:pre-wrap}
.mdl{margin-bottom:48px}
.mrow{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:calc(15px*var(--fs,1));margin-bottom:10px}
.bar{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;width:0;background:var(--text);transition:width .2s}
.mbtn{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;color:var(--text);transition:background .2s}
.mbtn:hover{background:var(--hover)}.mbtn:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<div class="app">
 <aside class="side" id="side">
  <div class="side-top">
   <div class="brand" id="logoS"></div>
   <button class="ibtn" id="newBtn" aria-label="Chat baru"></button>
  </div>
  <label class="search" id="srch"><span id="sIcon"></span><input id="q" placeholder="Cari chat" autocomplete="off"></label>
  <nav class="list" id="hist"></nav>
  <button class="prof" id="profBtn"><span id="uIcon"></span><span>Profil</span></button>
 </aside>
 <div class="scrim" id="scrim"></div>
 <main class="main">
  <header class="top">
   <button class="ibtn menu" id="menuBtn" aria-label="Riwayat"></button>
   <div class="brand" id="logoT"></div>
   <button class="ibtn" id="newBtn2" aria-label="Chat baru"></button>
  </header>
  <section class="chat" id="chat"><div class="col" id="col"></div></section>
  <div class="dock" id="dock">
   <div class="comp">
    <button class="ibtn" id="attBtn" aria-label="Lampiran"></button>
    <textarea id="inp" rows="1" placeholder="Tulis pesan ke Fline AI"></textarea>
    <button class="ibtn" id="micBtn" aria-label="Suara"></button>
    <button class="send" id="sendBtn" aria-label="Kirim"></button>
   </div>
  </div>
  <section class="set" id="set" hidden>
   <div class="col">
    <button class="back" id="backBtn"></button>
    <h2>Profil</h2>
    <h3>Model AI</h3>
    <div class="mdl"><div class="mrow"><span id="mst">...</span><span id="mpc"></span></div><div class="bar"><i id="mbar"></i></div><button class="mbtn" id="mbtn">Unduh model</button></div>
    <h3>Tema</h3>
    <div class="themes" id="themes"></div>
    <h3 class="row"><span>Ukuran teks</span><span id="szv"></span></h3>
    <div class="size"><span class="s1">Aa</span><input type="range" id="sz" min="0.85" max="1.4" step="0.05" value="1" aria-label="Ukuran teks"><span class="s2">Aa</span></div>
    <h3>Font</h3>
    <div class="fonts" id="fonts"></div>
   </div>
  </section>
 </main>
</div>
<script type="module">
import { Wllama } from 'https://cdn.jsdelivr.net/npm/@wllama/wllama@3.1.0/esm/index.js';
import WasmFromCDN from 'https://cdn.jsdelivr.net/npm/@wllama/wllama@3.1.0/esm/wasm-from-cdn.js';
const MODEL_URL='https://huggingface.co/bartowski/Qwen_Qwen3-0.6B-GGUF/resolve/main/Qwen_Qwen3-0.6B-Q4_K_M.gguf';
let w=null,loading=null;
window.FlineLLM={
 ready:false,
 async load(onProgress){
  if(this.ready)return;
  if(!loading)loading=(async()=>{
   w=new Wllama(WasmFromCDN);
   await w.loadModelFromUrl(MODEL_URL,{n_ctx:2048,progressCallback:({loaded,total})=>onProgress&&total&&onProgress(Math.round(loaded/total*100))});
   this.ready=true;
  })();
  try{await loading}catch(e){loading=null;throw e}
 },
 async chat(messages){
  const r=await w.createChatCompletion({messages,max_tokens:512,temperature:0.7});
  return r.choices[0].message.content.replace(/<think>[\s\S]*?<\/think>/g,'').replace(/<think>[\s\S]*$/,'').trim()||'(kosong)';
 }
};
</script>
<script>
const P={plus:'M12 5v14M5 12h14',clock:'M4 7h16M4 12h10M4 17h13',srch:'M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4',clip:'M20 11l-8.5 8.5a5 5 0 0 1-7-7L13 4a3.3 3.3 0 0 1 4.7 4.7L9.2 17.2a1.7 1.7 0 0 1-2.4-2.4L14 7.6',mic:'M12 15a3 3 0 0 0 3-3V7a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zM6 11a6 6 0 0 0 12 0M12 17v3',up:'M12 19V5M6 11l6-6 6 6',user:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4.5 20a7.5 7.5 0 0 1 15 0',back:'M15 5l-7 7 7 7',ck:'M5 12.5l4.5 4.5L19 7.5'};
const ic=k=>`<svg class="i" viewBox="0 0 24 24"><path d="${P[k]}"/></svg>`;
const mark=`<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><circle cx="16" cy="16" r="9.5"/><path d="M3 16h8M21 16h8" opacity=".9"/><circle cx="16" cy="16" r="1.6" fill="currentColor" stroke="none"/></svg>`;
const $=id=>document.getElementById(id);
$('logoS').innerHTML=$('logoT').innerHTML=mark+'<span>Fline AI</span>';
$('newBtn').innerHTML=$('newBtn2').innerHTML=ic('plus');$('menuBtn').innerHTML=ic('clock');
$('sIcon').innerHTML=ic('srch');$('uIcon').innerHTML=ic('user');$('attBtn').innerHTML=ic('clip');
$('micBtn').innerHTML=ic('mic');$('sendBtn').innerHTML=ic('up');$('backBtn').innerHTML=ic('back')+'<span>Kembali</span>';
const THEMES=[['dark','Gelap'],['light','Terang'],['cream','Krem']];
const FONTS=[['Inter','Sans Modern'],['Plus Jakarta Sans','Sans Bersih'],['Outfit','Sans Geometris'],['Source Sans 3','Sans Humanis'],['Barlow Semi Condensed','Sans Ringkas'],['Raleway','Sans Elegan']];
let st={theme:'dark',font:'Inter',size:1};
try{Object.assign(st,JSON.parse(localStorage.getItem('fline')||'{}'))}catch(e){}
function apply(){
 document.documentElement.dataset.theme=st.theme;
 document.documentElement.style.setProperty('--font',`'${st.font}',system-ui,sans-serif`);
 document.documentElement.style.setProperty('--fs',st.size);$('sz').value=st.size;$('szv').textContent=Math.round(st.size*100)+'%';
 try{localStorage.setItem('fline',JSON.stringify(st))}catch(e){}
 $('themes').innerHTML=THEMES.map(([k,n])=>`<button class="${st.theme==k?'on':''}" data-t="${k}">${n}</button>`).join('');
 $('fonts').innerHTML=FONTS.map(([f,n])=>`<button class="${st.font==f?'on':''}" data-f="${f}"><b style="font-family:'${f}'">${n}</b><small style="font-family:'${f}'">Teknologi yang tenang, percakapan yang fokus</small><span class="ck">${ic('ck')}</span></button>`).join('');
}
$('themes').onclick=e=>{const b=e.target.closest('[data-t]');if(b){st.theme=b.dataset.t;apply()}};
$('fonts').onclick=e=>{const b=e.target.closest('[data-f]');if(b){st.font=b.dataset.f;apply()}};
/* data */
const chats=[
 {id:1,g:'Hari ini',t:'Menolak rapat dengan sopan',m:[['u','Bantu aku tulis pesan singkat yang tenang untuk menolak rapat.'],['a',['Ini versi yang tetap hangat tanpa banyak penjelasan:','Hai Maya, terima kasih atas undangannya. Kali ini aku belum bisa ikut karena minggu ini aku menjaga waktu untuk fokus. Kalau ada keputusan yang perlu dariku, kirim detailnya dan akan kubalas paling lambat Kamis.','Mau dibuat lebih singkat, atau lebih formal?']]]},
 {id:2,g:'Hari ini',t:'Daftar bacaan akhir pekan',m:[]},
 {id:3,g:'Kemarin',t:'Jelaskan tidal locking dengan sederhana',m:[]},
 {id:4,g:'Kemarin',t:'Rencana makan untuk minggu sibuk',m:[]},
 {id:5,g:'7 hari terakhir',t:'Nama untuk toko roti kecil',m:[]},
 {id:6,g:'7 hari terakhir',t:'Ringkas klausul kontrak ini',m:[]},
 {id:7,g:'7 hari terakhir',t:'Liburan ke Kyoto bulan November',m:[]},
 {id:8,g:'Lebih lama',t:'Belajar membaca partitur',m:[]}
];
let cur=1,busy=false;
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function renderHist(){
 const q=$('q').value.toLowerCase();let last='',h='';
 chats.filter(c=>c.t.toLowerCase().includes(q)).forEach(c=>{
  if(c.g!=last){h+=`<div class="grp">${c.g}</div>`;last=c.g}
  h+=`<button class="item ${c.id==cur?'on':''}" data-id="${c.id}">${esc(c.t)}</button>`;
 });
 $('hist').innerHTML=h||'<div class="grp">Tidak ada hasil</div>';
}
function renderChat(){
 const c=chats.find(x=>x.id==cur);
 if(!c||!c.m.length){$('col').innerHTML=`<div class="hero">${mark}<h1>Ada yang bisa dibantu hari ini?</h1></div>`;$('col').style.cssText='height:100%;max-width:none;padding:0';return}
 $('col').style.cssText='';
 $('col').innerHTML=c.m.map(([r,x])=>r=='u'?`<div class="msg u"><p>${esc(x)}</p></div>`:`<div class="msg a">${x.map(p=>`<p>${esc(p)}</p>`).join('')}</div>`).join('');
 $('chat').scrollTop=1e9;
}
function open(id){cur=id;show('chat');renderHist();renderChat();closeSide()}
function newChat(){const c={id:Date.now(),g:'Hari ini',t:'Chat baru',m:[]};chats.unshift(c);open(c.id)}
function show(v){const s=v=='set';$('set').hidden=!s;$('chat').hidden=s;$('dock').hidden=s;document.querySelector('.top').style.visibility=s?'hidden':''}
function closeSide(){$('side').classList.remove('open');$('scrim').classList.remove('open')}
$('hist').onclick=e=>{const b=e.target.closest('[data-id]');if(b)open(+b.dataset.id)};
$('q').oninput=renderHist;
$('newBtn').onclick=$('newBtn2').onclick=newChat;
$('menuBtn').onclick=()=>{$('side').classList.add('open');$('scrim').classList.add('open')};
$('scrim').onclick=closeSide;
$('profBtn').onclick=()=>{show('set');closeSide()};
$('backBtn').onclick=()=>show('chat');
/* composer */
const inp=$('inp');
inp.oninput=()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,140)+'px';$('sendBtn').classList.toggle('on',!!inp.value.trim())};
inp.onkeydown=e=>{if(e.key=='Enter'&&!e.shiftKey){e.preventDefault();send()}};
$('sendBtn').onclick=send;
const REPLIES=['Begini cara sederhana untuk memikirkannya. Mulai dari satu hasil yang paling penting, lalu mundur ke langkah terkecil berikutnya.','Aku bisa bantu. Ceritakan sedikit untuk siapa ini dan seberapa formal nuansanya, nanti kurapikan dari sana.'];
async function send(){
 const v=inp.value.trim();if(!v||busy)return;busy=true;
 const c=chats.find(x=>x.id==cur);
 if(c.t=='Chat baru'){c.t=v.slice(0,36);renderHist()}
 c.m.push(['u',v]);inp.value='';inp.style.height='auto';$('sendBtn').classList.remove('on');
 renderChat();
 const t=document.createElement('div');t.className='think';t.innerHTML='<span class="orb"></span><span>Sedang berpikir</span>';
 $('col').appendChild(t);$('chat').scrollTop=1e9;
 const label=t.lastChild;let txt;
 try{
  if(!window.FlineLLM||!FlineLLM.ready){
   if(mBusy){label.textContent='Model sedang dimuat...';while(mBusy)await new Promise(r=>setTimeout(r,500))}
   if(!window.FlineLLM||!FlineLLM.ready)throw new Error('Model belum siap. Buka Profil lalu tekan "Unduh model".');
   label.textContent='Sedang berpikir';
  }
  const hist=c.m.slice(-7).map(([r,x])=>({role:r=='u'?'user':'assistant',content:Array.isArray(x)?x.join('\n\n'):x}));
  hist[hist.length-1].content+=' /no_think';
  txt=await FlineLLM.chat([{role:'system',content:'Kamu Fline AI, asisten yang menjawab singkat dan jelas dalam bahasa yang dipakai pengguna.'},...hist]);
 }catch(err){txt='Gagal: '+(err.message||err)}
 t.remove();
 const box=document.createElement('div');box.className='msg a';box.innerHTML='<p></p>';
 $('col').appendChild(box);const p=box.firstChild,w=txt.split(' ');let i=0;
 const iv=setInterval(()=>{p.textContent=w.slice(0,++i).join(' ');$('chat').scrollTop=1e9;
  if(i>=w.length){clearInterval(iv);c.m.push(['a',txt.split(/\n{2,}/)]);busy=false}},15);
}
$('sz').oninput=e=>{st.size=+e.target.value;apply()};
/* model */
const MK='fline_model_ok';let mBusy=false;
function mset(t,pc,btn,dis){$('mst').textContent=t;$('mpc').textContent=pc==null?'':pc+'%';$('mbar').style.width=(pc||0)+'%';$('mbtn').textContent=btn;$('mbtn').disabled=!!dis}
async function loadModel(){
 if(!window.FlineLLM){mset('Mesin AI belum termuat. Buka sekali dengan internet.',null,'Coba lagi');return false}
 if(FlineLLM.ready){mset('Siap, jalan offline',100,'Model sudah terpasang',true);return true}
 if(mBusy)return false;mBusy=true;
 mset('Memuat model...',null,'Mohon tunggu',true);
 try{
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
  await FlineLLM.load(p=>mset('Mengunduh model...',p,'Mohon tunggu',true));
  try{localStorage.setItem(MK,'1')}catch(e){}
  mset('Siap, jalan offline',100,'Model sudah terpasang',true);return true;
 }catch(err){mset('Gagal: '+(err.message||err),0,'Coba lagi');return false}
 finally{mBusy=false}
}
$('mbtn').onclick=loadModel;
addEventListener('load',()=>{
 if(localStorage.getItem(MK))loadModel();else mset('Belum diunduh (±480MB, sekali saja)',0,'Unduh model');
 if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
});
apply();renderHist();renderChat();
</script>
